[package]
name = "dudes-pty"
description = "Daemon-owned attached-mode pseudoterminals: typed launch, bounded byte relay, resize and whole-tree teardown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
dudes-proto.workspace = true
dudes-providers.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }
rustix = { workspace = true, features = ["event", "fs", "pty", "stdio", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-spawn.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
] }

[dev-dependencies]
proc-macro2.workspace = true
tempfile.workspace = true

# the workspace lints table, copied whole, with exactly three deltas — `unsafe_code`
# `forbid` -> `deny`, plus the two `deny` lines below. Unsafe is confined to the two platform
# modules and pinned by tests/unsafe_grant.rs plus `cargo xtask lints`.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
